name:    prometheus
version: 3.0.0
author:  David Lohle <Proplex@users.noreply.github.com>
docs:    https://github.com/cloudfoundry/prometheus-boshrelease
code:    https://github.com/genesis-community/prometheus-genesis-kit

# 2.6.0 was our last big feature bump
genesis_version_min: 3.1.0
required_configs:
  cloud: [ new, blueprint, check ]

supports:
- aws
- azure
- gcp
- openstack
- vsphere
- stackit
- pve

credentials:
  base:
    grafanadb:
      password: random 64
    admin:
      password:   random 64
      secret_key: random 64

certificates:
  self-signed-cert:
    nginx:
      ca:
        valid_for: ${params.ca_validity_period}
      ssl_certificate:
        valid_for: ${params.webssl_validity_period}
        names:
        - ${params.static_ip}
#        - ${maybe:params.external_domain}

provided:
  +provided-cert:
    nginx/ssl_certificate:
      keys:
        certificate:
          prompt:    "SSL certificate for Prometheus"
          multiline: true
        key:
          prompt:    "SSL key for Prometheus"
          multiline: true
